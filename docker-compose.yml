version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: trainingarc_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db  # zapobiega utracie danych po restarcie kontenera

  web:
    build: .
    container_name: trainingarc_server
    ports:
      - "5000:5000"
    depends_on:
      - mongodb  # najpierw baza, a potem serwer
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/trainingarc

# Deklaracja wolumenu do przetrzymywania danych bazy
volumes:
  mongo_data: